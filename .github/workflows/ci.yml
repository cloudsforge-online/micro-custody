name: CI

# The whole file. Every service in the estate calls the ONE reusable workflow in micro-org rather
# than carrying its own copy — the measured target in docs/ecosystem/03 §5 is zero bespoke CI files.
# If this repository ever needs a job of its own, that is the signal the reusable workflow needs an
# input, not that this repository needs a fork of it.
#
# `service-ci.yml` typechecks, runs the suite against a real Postgres `ci_test` container, and FAILS
# the build if the database-backed suite skipped — which is why the suite reads
# CUSTODY_TEST_DATABASE_URL spelled exactly as the workflow exports it. It also enforces the estate
# rules (one database, no cross-service imports, the three health endpoints, no unleased timers) that
# repository walls used to enforce for free.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: custody
      database-env-var: CUSTODY_DATABASE_URL
      port: 4008
      # The image startup smoke test boots the real service, and `env.ts` validates its
      # configuration at import — so the container needs the variables it declares, not just a
      # database, or it exits before it serves /livez. These are CI-only NON-secrets: throwaway
      # values that only have to clear a length check, and URLs that are never dialled because
      # /livez needs no upstream. Never a real credential.
      #
      # THE MASTER SECRET IS THE COMMIT SHA, TWICE, AND NOT A WRITTEN-DOWN STRING.
      # `env.ts:assertMasterSecret` now refuses anything that reads as a placeholder, and the value
      # that used to sit here — `ci-only-not-a-real-secret-at-least-32-chars-0000` — was one: it is
      # exactly the shape that shipped a 40-character master secret in the estate's PUBLIC compose
      # file and booted, because it cleared a length check and a comment said it was fine.
      #
      # Two SHAs are 80 hex characters, which clears the 32-byte floor, and a hash clears the
      # entropy floor with margin (measured: minimum 3.04 bits per character over 200,000 doubled
      # SHA-1s, against a floor of 2.8). It changes every run, it is a PUBLIC value that could never
      # be mistaken for a credential, and no literal is left here for somebody to copy into a
      # deployment — which is the failure mode the whole change is about. The smoke container
      # encrypts nothing that outlives it.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=ci-only-not-a-real-secret-000000000000
        POLICY_BASE_URL=http://127.0.0.1:4011
        CUSTODY_MASTER_SECRET_V1=${{ github.sha }}${{ github.sha }}
    secrets:
      # @cloudsforge/* is resolved by link:../runtime and link:../contracts, so CI checks out
      # micro-runtime and micro-contracts as siblings — both private, so the workflow needs a
      # contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  publish:
    needs: [ci, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The sibling checkouts the Dockerfile's named build contexts need; without a
      # contents:read token they 404 and the build fails at the first COPY --from.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
